<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Plataforma de Cine - Sala')}"></head>
<body>

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<main class="flex-shrink-0 contenido">
    <div class="container" style="max-width: 600px;">
        <h1 th:text="${sala.id == null} ? #{msg.sala.form.new} : #{msg.sala.form.edit}">Sala</h1>

        <form th:action="${sala.id == null} ? @{/salas/insert} : @{/salas/update}"
              th:object="${sala}" method="post" class="mt-4">

            <input type="hidden" th:if="*{id != null}" th:field="*{id}"/>

            <div class="mb-3">
                <label for="numeroSala" class="form-label" th:text="#{msg.sala.numero}">Número</label>
                <input type="number" th:field="*{numeroSala}" class="form-control"/>
                <div class="text-danger" th:if="${#fields.hasErrors('numeroSala')}" th:errors="*{numeroSala}"></div>
            </div>

            <div class="mb-3">
                <label for="capacidad" class="form-label" th:text="#{msg.sala.capacidad}">Capacidad</label>
                <input type="number" th:field="*{capacidad}" class="form-control"/>
                <div class="text-danger" th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}"></div>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{tiene3D}" class="form-check-input"/>
                <label for="tiene3D" class="form-check-label" th:text="#{msg.sala.tiene3D}">3D</label>
            </div>

            <div class="mb-3">
                <label for="encargado.id" class="form-label" th:text="#{msg.sala.encargado}">Encargado</label>
                <select th:field="*{encargado.id}" class="form-select">
                    <option value="" th:text="#{msg.sala.form.select}"></option>
                    <option th:each="e : ${encargados}" th:value="${e.id}"
                            th:text="${e.nombre + ' ' + e.primerApellido}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('encargado')}" th:errors="*{encargado}"></div>
            </div>

            <div class="mb-3">
                <label for="proyector.id" class="form-label" th:text="#{msg.sala.proyector}">Proyector</label>
                <select th:field="*{proyector.id}" class="form-select">
                    <option value="" th:text="#{msg.sala.form.select}"></option>
                    <option th:each="p : ${proyectores}" th:value="${p.id}"
                            th:text="${p.marca + ' ' + p.modelo}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('proyector')}" th:errors="*{proyector}"></div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{msg.sala.form.save}">Guardar</button>
            <a th:href="@{/salas}" class="btn btn-secondary" th:text="#{msg.sala.form.cancel}">Cancelar</a>
        </form>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
