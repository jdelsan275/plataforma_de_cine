<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head (#{msg.actor-form.head-title})}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container contenido">
    <h1 th:text="${actor.id == null} ? #{msg.actor-form.add} : #{msg.actor-form.edit}"></h1>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <form th:action="${actor.id == null} ? @{/actores/insert} : @{/actores/update}"
          th:object="${actor}" method="post" class="mt-4">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="nombre" class="form-label" th:text="#{msg.actor-form.nombre}"></label>
            <input type="text" th:field="*{nombre}" id="nombre" class="form-control" />
            <div th:if="${#fields.hasErrors('nombre')}" class="text-danger" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label for="primerApellido" class="form-label" th:text="#{msg.actor-form.primerApellido}"></label>
            <input type="text" th:field="*{primerApellido}" id="primerApellido" class="form-control" />
            <div th:if="${#fields.hasErrors('primerApellido')}" class="text-danger" th:errors="*{primerApellido}"></div>
        </div>

        <div class="mb-3">
            <label for="segundoApellido" class="form-label" th:text="#{msg.actor-form.segundoApellido}"></label>
            <input type="text" th:field="*{segundoApellido}" id="segundoApellido" class="form-control" />
            <div th:if="${#fields.hasErrors('segundoApellido')}" class="text-danger" th:errors="*{segundoApellido}"></div>
        </div>

        <div class="mb-3">
            <label for="fechaNacimiento" class="form-label" th:text="#{msg.actor-form.fechaNacimiento}"></label>
            <input type="date" th:field="*{fechaNacimiento}" id="fechaNacimiento" class="form-control" />
            <div th:if="${#fields.hasErrors('fechaNacimiento')}" class="text-danger" th:errors="*{fechaNacimiento}"></div>
        </div>

        <div class="mb-3">
            <label for="nacionalidad" class="form-label" th:text="#{msg.actor-form.nacionalidad}"></label>
            <input type="text" th:field="*{nacionalidad}" id="nacionalidad" class="form-control" />
            <div th:if="${#fields.hasErrors('nacionalidad')}" class="text-danger" th:errors="*{nacionalidad}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{msg.actor-form.peliculas}"></label>
            <div class="border rounded p-3" style="max-height: 200px; overflow-y: auto;">
                <p th:if="${#lists.isEmpty(listPeliculas)}" class="text-muted mb-0" th:text="#{msg.actor-form.noPeliculas}"></p>
                <div th:each="pelicula : ${listPeliculas}" class="form-check">
                    <input type="checkbox"
                           th:field="*{peliculas}"
                           th:value="${pelicula.id}"
                           th:id="${'pelicula_' + pelicula.id}"
                           class="form-check-input" />
                    <label th:for="${'pelicula_' + pelicula.id}"
                           class="form-check-label"
                           th:text="${pelicula.titulo}"></label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${actor.id == null} ? #{msg.actor-form.create} : #{msg.actor-form.update}"></button>
    </form>

    <a th:href="@{/actores}" class="btn btn-secondary mt-3" th:text="#{msg.actor-form.returnback}"></a>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
