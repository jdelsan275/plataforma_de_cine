<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{msg.sala.title}">Salas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="#{msg.sala.title}">Salas</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <a th:href="@{/salas/new}" class="btn btn-primary mb-3" th:text="#{msg.sala.new}">Nueva sala</a>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th th:text="#{msg.sala.id}">ID</th>
            <th th:text="#{msg.sala.numero}">Número</th>
            <th th:text="#{msg.sala.capacidad}">Capacidad</th>
            <th th:text="#{msg.sala.tiene3D}">3D</th>
            <th th:text="#{msg.sala.encargado}">Encargado</th>
            <th th:text="#{msg.sala.proyector}">Proyector</th>
            <th th:text="#{msg.sala.actions}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sala : ${listSalas}">
            <td th:text="${sala.id}"></td>
            <td th:text="${sala.numeroSala}"></td>
            <td th:text="${sala.capacidad}"></td>
            <td th:text="${sala.tiene3D} ? '✓' : '✗'"></td>
            <td th:text="${sala.encargado.nombre + ' ' + sala.encargado.primerApellido}"></td>
            <td th:text="${sala.proyector.marca + ' ' + sala.proyector.modelo}"></td>
            <td>
                <a th:href="@{/salas/edit(id=${sala.id})}" class="btn btn-sm btn-primary"
                   th:text="#{msg.sala.edit}">Editar</a>
                <form th:action="@{/salas/delete}" method="post" class="d-inline"
                      th:onsubmit="'return confirm(\'' + #{msg.sala.delete.confirm} + '\');'">
                    <input type="hidden" name="id" th:value="${sala.id}"/>
                    <button type="submit" class="btn btn-sm btn-danger"
                            th:text="#{msg.sala.delete}">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listSalas)}">
            <td colspan="7" class="text-center" th:text="#{msg.sala.empty}">No hay salas</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
